openapi: 3.0.0
info:
  contact:
    name: "Tony Ko"
    url: "https://github.com/tainenko/TaskService"
  title: "Task Service"
  description: OpenAPI.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: local
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: User created; returns an access token
        '400':
          description: Invalid email or password (8-72 characters)
        '409':
          description: Email already registered
        '429':
          description: Too many requests (see Retry-After header)
  /auth/refresh:
    post:
      summary: Exchange a refresh token
      description: >
        Single-use: returns a new access token and a new refresh token. Presenting an
        already-used token revokes the whole session chain.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access and refresh tokens
        '401':
          description: Invalid, expired or reused refresh token
        '429':
          description: Too many requests (see Retry-After header)
  /auth/logout:
    post:
      summary: End the session of a refresh token
      description: Idempotent; unknown tokens are ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logged out
  /auth/logout-all:
    post:
      summary: End all sessions of the current user
      responses:
        '200':
          description: Logged out everywhere
        '401':
          description: Missing or invalid access token
  /auth/login:
    post:
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Returns an access token
        '401':
          description: Invalid email or password
        '429':
          description: Too many requests or too many failed logins for this account (see Retry-After header)
  /tasks:
    get:
      summary: Get task list
      description: Get paginated list of tasks with optional filters
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: pageSize
          schema:
            type: integer
          description: Number of items per page
        - in: query
          name: sort
          schema:
            type: string
          description: Field to sort by
        - in: query
          name: order
          schema:
            type: string
            enum: [ asc, desc ]
          description: Sort order
        - in: query
          name: name
          schema:
            type: string
          description: Filter by task name
        - in: query
          name: status
          schema:
            type: integer
            enum: [ 0, 1, 2 ]
          description: "Filter by task status (0 = todo, 1 = done, 2 = in progress)"
        - in: query
          name: tag
          schema:
            type: string
            maxLength: 50
          description: Only tasks with this tag (case-insensitive)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    type: object
                    properties:
                      totalRecords:
                        type: integer
                        description: Total number of records
                      currentPage:
                        type: integer
                        description: Current page number
                      totalPages:
                        type: integer
                        description: Total number of pages
                      nextPage:
                        type: integer
                        description: Next page number
                      prevPage:
                        type: integer
                        description: Previous page number
    post:
      summary: Create new task
      description: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: integer


  /tasks/{id}:
    get:
      summary: Get task
      description: Get a single task by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Task ID
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
    put:
      summary: Update task
      description: Update an existing task by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string

    delete:
      summary: Delete task
      description: Delete an existing task by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Task ID
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string

  /tasks/batch:
    post:
      summary: Create up to 100 tasks atomically
      description: All tasks are created or none is. Returns the new IDs in input order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ tasks ]
              properties:
                tasks:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Created
        '400':
          description: Invalid payload (nothing was created)
    delete:
      summary: Delete up to 100 tasks
      description: IDs that do not exist or belong to someone else are reported in not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ ids ]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
      responses:
        '200':
          description: "{processed: [ids], not_found: [ids]}"
  /tasks/batch/status:
    patch:
      summary: Set the status of up to 100 tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ ids, status ]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                status:
                  type: integer
                  enum: [ 0, 1, 2 ]
      responses:
        '200':
          description: "{processed: [ids], not_found: [ids]}"
  /tags:
    get:
      summary: List your tags
      description: Tags with the number of (non-deleted) tasks using each
      responses:
        '200':
          description: OK
  /tags/{id}:
    delete:
      summary: Delete a tag
      description: Removes the tag and detaches it from all tasks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
        '404':
          description: Tag not found
  /tasks/{id}/status:
    patch:
      summary: Update task status
      description: Change only the status of a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: integer
                  enum: [ 0, 1, 2 ]
      responses:
        '200':
          description: Status updated
        '404':
          description: Task not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    Credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
    Task:
      type: object
      properties:
        id:
          type: integer
          description: Task ID
        name:
          type: string
          description: Task name
        status:
          type: integer
          enum: [ 0, 1, 2 ]
          description: 0 = todo, 1 = done, 2 = in progress
        description:
          type: string
        due_date:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          enum: [ 0, 1, 2 ]
          description: 0 = low, 1 = medium, 2 = high
        tags:
          type: array
          description: Normalized to lowercase and de-duplicated
          maxItems: 10
          items:
            type: string
            maxLength: 50
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskInput:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: Task name
        status:
          type: integer
          enum: [ 0, 1, 2 ]
          description: 0 = todo, 1 = done, 2 = in progress
        description:
          type: string
        due_date:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer
          enum: [ 0, 1, 2 ]
          description: 0 = low, 1 = medium, 2 = high
        tags:
          type: array
          description: "Replaces the task's tags. Omit to leave unchanged; [] clears them"
          maxItems: 10
          items:
            type: string
            maxLength: 50
