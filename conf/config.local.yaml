mode: local

Server:
  RunMode: debug
  HttpPort: 8080

App:
  LogSavePath: storage/logs
  LogFileName: app
  LogFileExt: .log

Database:
  DBType: postgres
  Username: postgres
  Password: password
  Host: postgres
  DBName: postgres
Auth:
  # Override in real deployments with TASK_AUTH_JWTSECRET
  JWTSecret: dev-only-secret-change-me-0123456789abcdef
  TokenTTLMinutes: 15
  RefreshTTLHours: 720
