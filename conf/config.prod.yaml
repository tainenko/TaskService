mode: local

Server:
  RunMode: debug
  HttpPort: 8080

App:
  LogSavePath: storage/logs
  LogFileName: app
  LogFileExt: .log

Database:
  DBType: postgres
  Username: postgres
  Password: postgres
  Host: 127.0.0.1:5432
  DBName: postgres
Auth:
  # Override in real deployments with TASK_AUTH_JWTSECRET
  JWTSecret: ""
  TokenTTLMinutes: 15
  RefreshTTLHours: 720
